# SPDX-License-Identifier: CC0-1.0
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to test
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 180
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git github-cli cmake ninja extra-cmake-modules \
            ffmpeg mpvqt kdsingleapplication kcolorscheme kconfig kcoreaddons kcrash kdeclarative \
            kfilemetadata ki18n kiconthemes kio kirigami kitemmodels kservice kwindowsystem \
            qqc2-desktop-style breeze-icons qt6-5compat qt6-base qt6-declarative qt6-websockets \
            qt6-shadertools qt6-wayland gtk3 patchelf curl fuse2
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Build Arch Linux package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(haruna VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          sed -i "s/^pkgver=.*/pkgver=$version/" .github/PKGBUILD
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c 'cd "$GITHUB_WORKSPACE/.github" && makepkg --noconfirm'
      - name: Build AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash appimage.sh
      - name: Upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          packages=(.github/*.pkg.tar.zst)
          test -f "${packages[0]}"
          test -f Haruna-SharePlay-x86_64.AppImage
          gh release upload "$RELEASE_TAG" "${packages[@]}" Haruna-SharePlay-x86_64.AppImage

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || inputs.ref }}
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-kdsingleapplication
            mingw-w64-ucrt-x86_64-kcolorscheme
            mingw-w64-ucrt-x86_64-kconfig
            mingw-w64-ucrt-x86_64-kcoreaddons
            mingw-w64-ucrt-x86_64-kcrash
            mingw-w64-ucrt-x86_64-kdeclarative
            mingw-w64-ucrt-x86_64-kfilemetadata
            mingw-w64-ucrt-x86_64-ki18n
            mingw-w64-ucrt-x86_64-kiconthemes
            mingw-w64-ucrt-x86_64-kio
            mingw-w64-ucrt-x86_64-kirigami
            mingw-w64-ucrt-x86_64-kwindowsystem
            mingw-w64-ucrt-x86_64-qqc2-desktop-style
            mingw-w64-ucrt-x86_64-breeze-icons
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-nsis
      - name: Build MpvQt
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.2.1 https://github.com/KDE/mpvqt.git "$RUNNER_TEMP/mpvqt"
          cmake -S "$RUNNER_TEMP/mpvqt" -B "$RUNNER_TEMP/mpvqt-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/ucrt64 -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/mpvqt-build" --parallel
          cmake --install "$RUNNER_TEMP/mpvqt-build"
      - name: Build Haruna
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/haruna-stage" -DBUILD_TESTING=OFF
          cmake --build build --parallel
          cmake --install build
      - name: Package installer
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/haruna-stage"
          cp /ucrt64/bin/*.dll "$stage/bin/"
          cp -r /ucrt64/share/qt6/plugins "$stage/bin/"
          cp -r /ucrt64/share/qt6/qml "$stage/bin/"
          if [ -d /ucrt64/bin/data ]; then cp -r /ucrt64/bin/data "$stage/bin/"; fi
          printf '[Paths]\nPlugins = plugins\nQmlImports = qml\n' > "$stage/bin/qt.conf"
          makensis -DSTAGE="$(cygpath -w "$stage")" -DOUTPUT="$(cygpath -w "$RUNNER_TEMP/haruna-windows-x86_64-setup.exe")" .github/windows/installer.nsi
      - name: Install and smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'haruna-installed'
          $installer = Join-Path $env:RUNNER_TEMP 'haruna-windows-x86_64-setup.exe'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $env:HARUNA_LOG_FILE = Join-Path $env:RUNNER_TEMP 'haruna-startup.log'
          $env:QML_IMPORT_TRACE = '1'
          $env:QT_DEBUG_PLUGINS = '1'
          $app = Start-Process -FilePath (Join-Path $installDir 'bin\haruna.exe') -WorkingDirectory (Join-Path $installDir 'bin') -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            do {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "Haruna exited during startup: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) { break }
            } while ((Get-Date) -lt $deadline)
            if ($app.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Haruna did not open its main window within 60 seconds' }
          } finally {
            if (Test-Path $env:HARUNA_LOG_FILE) { Get-Content $env:HARUNA_LOG_FILE }
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: haruna-windows-msys2-test
          path: ${{ runner.temp }}/haruna-windows-x86_64-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$env:RELEASE_TAG" (Join-Path $env:RUNNER_TEMP 'haruna-windows-x86_64-setup.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
